spring.application.name=biblioteca-api
server.port=8080

# ---------------------------------------------------------------------------
# Conexion a MySQL
# Las credenciales se pueden sobreescribir con variables de entorno DB_USER / DB_PASSWORD
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/biblioteca_ues?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:ROOT}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# El esquema se crea con el script src/main/resources/db/biblioteca_ues.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Respuestas de error de Spring en formato JSON
server.error.include-message=always

# OpenAPI / Swagger UI -> http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
